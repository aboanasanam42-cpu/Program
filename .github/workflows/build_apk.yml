name: Build Android Release APK (Android 15)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (SDK 35)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Configure Keystore
        id: keystore-setup
        run: |
          # 1. Restore debug.keystore from debug.keystore.base64
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 --decode debug.keystore.base64 > "${{ github.workspace }}/debug.keystore"
          fi

          # If still missing, generate fallback debug keystore
          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            echo "Generating fallback debug.keystore with keytool..."
            keytool -genkey -v -keystore "${{ github.workspace }}/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Check for custom upload keystore from secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "No custom keystore secret found. Using debug.keystore for signing."
            echo "KEYSTORE_PATH=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: 🔨 Grant Execute Permission to Gradle Wrapper (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: 🚀 Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Ensure .env file exists for secrets plugin
          if [ ! -f ".env" ]; then
            touch .env
            echo "GEMINI_API_KEY=dummy" >> .env
          fi

          GRADLE_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi
          
          echo "Using build runner: $GRADLE_CMD"
          echo "Running assembleRelease..."
          $GRADLE_CMD assembleRelease --no-configuration-cache --stacktrace || {
            echo "assembleRelease failed, building assembleDebug fallback..."
            $GRADLE_CMD assembleDebug --no-configuration-cache --stacktrace
          }

      - name: 📦 Prepare APK Artifacts for Upload
        id: prepare-apk
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \;
          echo "Found APK files in output directory:"
          ls -la build_output/
          
          # Standardize primary APK name for direct download
          for f in build_output/*release*.apk build_output/*debug*.apk; do
            if [ -f "$f" ]; then
              cp "$f" build_output/DR-MALIK-Math.apk
              break
            fi
          done

      - name: 📤 Upload APK Artifact (Download via GitHub UI)
        uses: actions/upload-artifact@v4
        with:
          name: DR_MALIK_Math_APK
          path: build_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌐 Create GitHub Release with Direct APK Download Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0
          name: "DR/MALIK Math App v1.0"
          body: |
            ## تطبيق الرياضيات التفاعلي - DR/MALIK
            - **إصدار التطبيق:** v1.0
            - **نظام التشغيل المدعوم:** أندرويد (Android 7.0+ حتى Android 15)
            - **رابط التحميل المباشر للـ APK:**
            👉 [تحميل DR-MALIK-Math.apk](https://github.com/${{ github.repository }}/releases/download/v1.0/DR-MALIK-Math.apk)
            
            ---
            - فكرة: أ / محمد الرميمة
            - تصميم وبرمجة: د / مالك الرميمة
            - هاتف: 771134103
          files: build_output/DR-MALIK-Math.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📋 Summary Output
        run: |
          echo "### 🚀 تم بناء تطبيق DR/MALIK بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 **اسم التطبيق:** DR/MALIK Math (تطبيق الرياضيات التفاعلي)" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **نظام التشغيل:** أندرويد 15 (API 35)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **رابط التحميل المباشر للـ APK:** [تحميل DR-MALIK-Math.apk](https://github.com/${{ github.repository }}/releases/download/v1.0/DR-MALIK-Math.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **التحميل من صفحة الـ Action:** اضغط على زر التحميل في قسم **Artifacts** في أعلى الصفحة." >> $GITHUB_STEP_SUMMARY
          echo "- 📞 **بيانات المطور:** تصميم وبرمجة الدكتور / مالك الرميمة - هاتف / 771134103" >> $GITHUB_STEP_SUMMARY

